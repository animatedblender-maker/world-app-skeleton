# Render Blueprint for Matterya API (api.matterya.com)
# Dashboard: New > Blueprint > connect this repo, or copy settings into an existing Web Service.
services:
  - type: web
    name: matterya-api
    runtime: node
    branch: ios-native
    rootDir: apps/api
    # --no-workspaces: parent monorepo package.json would otherwise pull Capacitor/mobile
    # and break install against the root package-lock. Install only apps/api deps.
    buildCommand: npm install --no-workspaces --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PGSSLMODE
        value: require
      - key: APNS_BUNDLE_ID
        value: com.matterya.worldapp
      - key: APNS_PRODUCTION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: PUSH_VAPID_SUBJECT
        value: mailto:support@matterya.com

      # --- Kafka (managed broker — NOT localhost) ---
      # 1) Create a free/paid cluster at Upstash / Redpanda Cloud / Confluent
      # 2) Paste credentials in Render Dashboard → Environment
      # 3) Start with KAFKA_SHADOW=true, then set false after validation
      - key: KAFKA_ENABLED
        sync: false
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_CLIENT_ID
        value: matterya-api-render
      - key: KAFKA_CONSUMER_GROUP
        value: matterya-api-workers
      - key: KAFKA_SHADOW
        sync: false
      - key: KAFKA_SSL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_REPLICATION_FACTOR
        sync: false
      - key: KAFKAJS_NO_PARTITIONER_WARNING
        value: "1"
