# Render Blueprint for Matterya API (api.matterya.com)
# Dashboard: New > Blueprint > connect this repo, or copy settings into an existing Web Service.
services:
  - type: web
    name: matterya-api
    runtime: node
    branch: ios-native
    rootDir: apps/api
    # CRITICAL: Dashboard often still has "npm ci && npm run build" which breaks
    # monorepo installs. Set Build Command to EXACTLY: npm run render-build
    # (see docs/RENDER.md). Blueprint alone often does not update existing services.
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PGSSLMODE
        value: require
      - key: APNS_BUNDLE_ID
        value: com.matterya.worldapp
      - key: APNS_PRODUCTION
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_PRIVATE_KEY
        sync: false
      - key: PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: PUSH_VAPID_SUBJECT
        value: mailto:support@matterya.com

      # --- Matterya signup confirmation email (Resend) ---
      # 1) Create account at https://resend.com and get an API key
      # 2) Verify domain matterya.com (DNS) so MAIL_FROM can send
      # 3) Set RESEND_API_KEY + MAIL_FROM in Render Dashboard (sync: false)
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: Matterya <noreply@matterya.com>
      - key: PUBLIC_WEB_ORIGIN
        value: https://matterya.com

      # --- Platform reports page (https://api.matterya.com/reports) ---
      - key: REPORTS_PAGE_PASSWORD
        value: "54isamr!"

      # --- Kafka (managed broker — NOT localhost) ---
      # 1) Create a free/paid cluster at Upstash / Redpanda Cloud / Confluent
      # 2) Paste credentials in Render Dashboard → Environment
      # 3) Start with KAFKA_SHADOW=true, then set false after validation
      - key: KAFKA_ENABLED
        sync: false
      - key: KAFKA_BROKERS
        sync: false
      - key: KAFKA_CLIENT_ID
        value: matterya-api-render
      - key: KAFKA_CONSUMER_GROUP
        value: matterya-api-workers
      - key: KAFKA_SHADOW
        sync: false
      - key: KAFKA_SSL
        sync: false
      - key: KAFKA_SASL_MECHANISM
        sync: false
      - key: KAFKA_SASL_USERNAME
        sync: false
      - key: KAFKA_SASL_PASSWORD
        sync: false
      - key: KAFKA_REPLICATION_FACTOR
        sync: false
      - key: KAFKAJS_NO_PARTITIONER_WARNING
        value: "1"

      # --- Content pipeline (R2 → owned posts + feed shares + re-sign) ---
      # Cron hits POST /cron/content-pipeline with x-cron-secret
      - key: CONTENT_CRON_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: matterya-sparks
      - key: R2_ENDPOINT
        sync: false
      # Frame 0 runs in-process on this web service (ffmpeg-static). No extra worker bill.
      - key: MEDIA_WORKER_INPROCESS
        value: "true"

  # Optional later: dedicated Docker media worker (Dockerfile.media-worker) if you
  # outgrow in-process Frame 0. Not required — leave undeployed to avoid extra cost.
  # See docs/MEDIA_FRAME0.md

  # Every 6h: discover new R2 packs, create owned Sparks + feed shares, re-sign URLs.
  - type: cron
    name: matterya-content-pipeline
    runtime: node
    branch: ios-native
    rootDir: apps/api
    schedule: "0 */6 * * *"
    buildCommand: "true"
    startCommand: node scripts/run-content-pipeline-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CONTENT_CRON_SECRET
        sync: false
      - key: INSIGHTS_CRON_SECRET
        sync: false
      - key: CONTENT_PIPELINE_URL
        value: https://api.matterya.com/cron/content-pipeline
